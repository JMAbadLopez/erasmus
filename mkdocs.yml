site_name: Portal Erasmus+ y Eurotrainee
site_description: Repositorio documental y guía de gestión de programas de internacionalización educativa (GVA)
site_author: Coordinación Erasmus
site_url: "https://jmabadlopez.github.io/erasmus/"

theme:
  name: material
  language: es
  logo: ./assets/camp.png
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_javascript:
  - assets/javascripts/mermaid.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - def_list
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Eurotrainee (GVA):
      - Visión General: eurotrainee/index.md
      - Eurotrainee Alumnado:
          - Requisitos y Plazas: eurotrainee/alumnado-requisitos-plazas.md
          - Tramitación y Selección: eurotrainee/alumnado-tramitacion-seleccion.md
          - Reconocimiento FE / FCT (SAÒ): eurotrainee/alumnado-reconocimiento-sao.md
          - Preguntas Frecuentes: eurotrainee/alumnado-preguntas-frecuentes.md
      - Eurotrainee Profesorado:
          - Requisitos y Plazas: eurotrainee/requisitos-plazas.md
          - Baremo y Puntuación: eurotrainee/baremo-puntuacion.md
          - Tramitación en OVICE: eurotrainee/tramitacion-ovice.md
          - Adjudicación y Alegaciones: eurotrainee/adjudicacion-plazos.md
          - Fases Posteriores y Certificación: eurotrainee/fases-posteriores.md
  - Erasmus+ Educación Superior:
      - Visión General (KA1): erasmus-plus/index.md
      - Movilidades de Alumnado (Prácticas): erasmus-plus/movilidades-alumnado.md
      - Movilidades de Profesorado (STA/STT): erasmus-plus/movilidades-profesorado.md
      - Carta ECHE y Créditos ECTS: erasmus-plus/carta-eche-reconocimiento.md
  - Gestión y Coordinación:
      - Checklist para Convocatorias: coordinacion/checklist-convocatorias.md
      - Difusión Interna en el Centro: coordinacion/difusion-interna.md
